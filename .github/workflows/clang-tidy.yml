name: Clang-Tidy

on:
  push:
    branches-ignore:
      - main
      - release

  pull_request:
    branches-ignore:
      - main
      - release

jobs:
  clang-tidy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            clang-tidy \
            clang-format \
            cmake \
            ninja-build \
            portaudio19-dev \
            git-lfs \
            dotnet-sdk-8.0 \
            libjpeg62 \
            libwebp7 \
            libpng16-16 \
            libtiff6 \
            libopenexr-3-1-30 \
            libdc1394-25 \
            libgtk-3-0 \
            libyaml-cpp-dev

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCLANG_TIDY_AS_ERRORS=OFF

      - name: Build
        run: |
          cmake --build build

      # - name: Run clang-tidy
      #   run: |
      #     clang-tidy \
      #       -p build \
      #       $(find . -name '*.cpp' -not -path './build/*')

      - name: Run cpp-linter
        uses: cpp-linter/cpp-linter-action@v2
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: '21'
          style: file
          tidy-checks: ''
          files-changed-only: false

      - name: Fail on lint errors
        if: steps.linter.outputs.checks-failed > 0
        run: exit 1

        #putting auto-fix: true later 