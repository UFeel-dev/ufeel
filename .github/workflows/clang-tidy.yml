name: Clang-Tidy

on:
  push:
    branches-ignore:
      - main
      - release

  pull_request:
    branches-ignore:
      - main
      - release

jobs:
  clang-tidy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # - name: Install dependencies
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y \
      #       clang \
      #       clang-tidy \
      #       cmake \
      #       ninja-build \
      #       portaudio19-dev \
      #       git-lfs \
      #       dotnet-sdk-8.0 \
      #       libjpeg62 \
      #       libwebp7 \
      #       libpng16-16 \
      #       libtiff6 \
      #       libopenexr-3-1-30 \
      #       libdc1394-25 \
      #       libgtk-3-0 \
      #       libyaml-cpp-dev

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            portaudio19-dev \
            git-lfs \
            dotnet-sdk-8.0 \
            libjpeg62 \
            libwebp7 \
            libpng16-16 \
            libtiff6 \
            libopenexr-3-1-30 \
            libdc1394-25 \
            libgtk-3-0 \
            libyaml-cpp-dev

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCLANG_TIDY_AS_ERRORS=OFF

      - name: Check Git LFS and OpenCV
        run: |
          git lfs version
          git lfs ls-files | grep libopencv_world.so || true
          file 3rdparty/opencv/lib/libopencv_world.so
          ls -lh 3rdparty/opencv/lib/libopencv_world.so
          head -c 100 3rdparty/opencv/lib/libopencv_world.so | xxd

      - name: Build
        run: |
          cmake --build build

      # - name: Run clang-tidy
