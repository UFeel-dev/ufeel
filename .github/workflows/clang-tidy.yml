name: Clang-Tidy

on:
  push:
    branches-ignore:
      - main
      - release

  pull_request:
    branches-ignore:
      - main
      - release

jobs:
  clang-tidy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            clang-tidy \
            cmake \
            ninja-build \
            portaudio19-dev \
            git-lfs \
            libjpeg62 \
            libwebp7 \
            libpng16-16 \
            libtiff6 \
            libopenexr-3-1-30 \
            libdc1394-25 \
            libgtk-3-0 \
            libyaml-cpp-dev

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCLANG_TIDY_AS_ERRORS=OFF

      - name: Check OpenCV library
        run: |
          file 3rdparty/opencv/lib/libopencv_world.so
          ls -lh 3rdparty/opencv/lib/libopencv_world.so

      - name: Build
        run: |
          cmake --build build

      - name: Run clang-tidy
        run: |
          clang-tidy \
            -p build \
            $(find . -name '*.cpp' -not -path './build/*')