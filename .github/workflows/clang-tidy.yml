name: Clang-Tidy

on:
  push:
    branches-ignore:
      - main
      - release

  pull_request:
    branches-ignore:
      - main
      - release

jobs:
  clang-tidy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            clang-tidy \
            cmake \
            ninja-build \
            portaudio19-dev \
            git-lfs

      - name: Check PortAudio
        run: |
          dpkg -l | grep portaudio
          find /usr/include -name "portaudio.h" -print

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCLANG_TIDY_AS_ERRORS=OFF

      - name: Build
        run: |
          cmake --build build

      - name: Run clang-tidy
        run: |
          clang-tidy \
            -p build \
            $(find . -name '*.cpp' -not -path './build/*')