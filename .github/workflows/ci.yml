name: CI

on:
  push:
    branches-ignore:
      - main
      - release

  pull_request:
    branches-ignore:
      - main
      - release

jobs:
  build-and-analysis:
    name: Build and Static Analysis
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Add .NET repository
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:dotnet/backports

      - name: Install lint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wget \
            ca-certificates \
            git-lfs \
            cmake \
            ninja-build \
            portaudio19-dev \
            dotnet-sdk-10.0 \
            ninja-build \
            libasound2 \
            libfontconfig1 \
            libice6 \
            libsm6 \
            libyaml-cpp-dev \
            patchelf \
            iwyu
            

          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          rm llvm.sh

          sudo apt-get install -y \
            clang-22 \
            clang-tidy-22 \
            clang-format-22

      - name: Configure CMake for Clang-Tidy
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCLANG_TIDY_AS_ERRORS=OFF


      - name: Build Docker image
        run: |
          docker build -t ufeeldocker:latest ./docker

      - name: Build project in Docker
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/mnt" \
            -w /mnt \
            ufeeldocker:latest \
            bash -lc "./build.sh configure && ./build.sh build"

      - name: Run Clang-Tidy
        run: |
          find Library Wrapper -type f -name '*.cpp' -print0 |
          while IFS= read -r -d '' file; do
            echo "::group::Clang-Tidy: $file"
            ./build.sh lint "$file" || echo "::warning file=$file::Clang-Tidy returned a non-zero exit code"
            echo "::endgroup::"
          done



