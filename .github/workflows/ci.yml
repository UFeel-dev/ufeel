
name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

jobs:
  build-and-analysis:
    name: Build and Static Analysis
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true
          submodules: recursive

      - name: Add .NET repository
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:dotnet/backports

      - name: Install lint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wget \
            ca-certificates \
            git-lfs \
            cmake \
            ninja-build \
            portaudio19-dev \
            libcurl4-openssl-dev \
            dotnet-sdk-10.0 \
            libasound2 \
            libfontconfig1 \
            libice6 \
            libsm6 \
            patchelf \
            iwyu

          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          rm llvm.sh

          sudo apt-get install -y \
            clang-22 \
            clang-tidy-22 \
            clang-format-22

      - name: Configure CMake for Clang-Tidy
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCLANG_TIDY_AS_ERRORS=OFF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          load: true
          tags: ufeeldocker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build project in Docker
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/mnt" \
            -w /mnt \
            ufeeldocker:latest \
            bash -lc "./build.sh configure && ./build.sh build"

      # - name: Run unit tests in Docker
      #   run: |
      #     docker run --rm \
      #       -v "$GITHUB_WORKSPACE:/mnt" \
      #       -w /mnt \
      #       ufeeldocker:latest \
      #       bash -lc "./build.sh run-unit-tests"

      - name: Run lint (clang-tidy + clang-format) in Docker
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/mnt" \
            -w /mnt \
            ufeeldocker:latest \
            bash -lc './build.sh lint'
