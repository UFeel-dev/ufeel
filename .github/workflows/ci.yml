name: CI

on:
  push:
    branches-ignore:
      - main
      - release

  pull_request:
    branches-ignore:
      - main
      - release

jobs:
  build-and-analysis:
    name: Build and Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install lint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            clang-tidy \
            clang-format \
            git-lfs \
            cmake \
            ninja-build \

      - name: Configure CMake for Clang-Tidy
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCLANG_TIDY_AS_ERRORS=OFF


      - name: Build Docker image
        run: |
          docker build -t ufeeldocker:latest ./docker

      - name: Build project in Docker
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/mnt" \
            -w /mnt \
            ufeeldocker:latest \
            bash -lc "./build.sh configure && ./build.sh build"

      - name: Run cpp-linter
        uses: cpp-linter/cpp-linter-action@v2
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: '21'
          style: file
          tidy-checks: ''
          extensions: 'cpp'
          files-changed-only: false
          database: 'build'

      # - name: Fail on lint errors
      #   if: steps.linter.outputs.checks-failed > 0
        # run: exit 1