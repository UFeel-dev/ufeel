name: CI

on:
  push:

  pull_request:
   
jobs:
  build-and-analysis:
    name: Build and Static Analysis
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Add .NET repository
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:dotnet/backports

      - name: Install lint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wget \
            ca-certificates \
            git-lfs \
            cmake \
            ninja-build \
            portaudio19-dev \
            dotnet-sdk-10.0 \
            ninja-build \
            libasound2 \
            libfontconfig1 \
            libice6 \
            libsm6 \
            libyaml-cpp-dev \
            patchelf \
            iwyu
            

          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          rm llvm.sh

          sudo apt-get install -y \
            clang-22 \
            clang-tidy-22 \
            clang-format-22

      - name: Configure CMake for Clang-Tidy
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCLANG_TIDY_AS_ERRORS=OFF

      - name: Build Docker image
        run: |
          docker build -t ufeeldocker:latest ./docker

      - name: Build project in Docker
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/mnt" \
            -w /mnt \
            ufeeldocker:latest \
            bash -lc "./build.sh configure && ./build.sh build"

      - name: Run Clang-Tidy in Docker
        shell: bash
        run: |
          set +e

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/mnt" \
            -w /mnt \
            ufeeldocker:latest \
            bash -lc '
              find Library Wrapper -type f -name "*.cpp" -print0 |
              while IFS= read -r -d "" file; do
                echo "::group::Clang-Tidy: $file"
                ./build.sh lint "$file"
                echo "::endgroup::"
              done
            ' > clang-tidy.log 2>&1

          lint_status=$?
          cat clang-tidy.log

          while IFS= read -r line; do
            if [[ "$line" =~ ^/mnt/(Library|Wrapper)/.*:([0-9]+):([0-9]+):\ (warning|error):\ (.*)$ ]]; then
              file="${line%%:*}"
              file="${file#/mnt/}"
              number="${BASH_REMATCH[2]}"
              column="${BASH_REMATCH[3]}"
              level="${BASH_REMATCH[4]}"
              message="${BASH_REMATCH[5]}"

              message="${message//%/%25}"
              message="${message//$'\r'/%0D}"
              message="${message//$'\n'/%0A}"
              file="${file//%/%25}"
              file="${file//,/%2C}"

              if [[ "$level" == "error" ]]; then
                echo "::error file=$file,line=$number,col=$column::$message"
              else
                echo "::warning file=$file,line=$number,col=$column::$message"
              fi
            fi
          done < clang-tidy.log

          exit "$lint_status"
